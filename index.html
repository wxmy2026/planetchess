<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="description" content="一片星海，五股势力。每颗星球上，都有人在生活。一款关于战争与和平的策略小游戏。"><meta property="og:title" content="星球棋"><meta property="og:description" content="一片星海，五股势力。每颗星球上，都有人在生活。"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="星球棋"><meta property="og:image" content="https://wxmy2026.github.io/planetchess/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta property="og:url" content="https://wxmy2026.github.io/planetchess/"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星球棋</title>
<style>
:root{
  --bg:#DDE4EB; --paper:#EEF2F6; --ink:#1B2A41; --muted:#56657A; --line:#8E9CAE; --grid:#C9D3DE;
  --p0:#13789A; --p1:#B23A48; --p2:#A87414; --p3:#6C4F9E; --p4:#2F8F5B; --neutral:#7F8B9B;
  --panel:#F7F9FB; --accent:#13789A; --on-accent:#FFFFFF; --on-faction:#FFFFFF; --warn:#B23A48; --ok:#2F7D4F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1729; --paper:#132138; --ink:#E3E9F1; --muted:#97A5B8; --line:#4B5E7C; --grid:#1D2E4B;
    --p0:#55B8D6; --p1:#E46F7D; --p2:#E3B256; --p3:#AA8EDB; --p4:#6FD39A; --neutral:#7D8A9C;
    --panel:#17263F; --accent:#55B8D6; --on-accent:#0E1729; --on-faction:#0E1729; --warn:#E46F7D; --ok:#62C08A;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;font-weight:600}
header{display:flex;align-items:center;gap:6px 18px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--grid)}
header h1{margin:0;font-size:24px;letter-spacing:.12em}
.stat{color:var(--muted);font-size:14px;white-space:nowrap}
.stat b{color:var(--ink);font-size:19px;font-variant-numeric:tabular-nums;margin:0 5px}
header .end{margin-left:auto}
.layout{display:grid;grid-template-columns:1fr}
@media (min-width:860px){
  .layout{grid-template-columns:1fr 340px;height:calc(100vh - 58px)}
  #panel{overflow-y:auto;border-left:1px solid var(--grid)}
  #mapwrap{display:flex;align-items:center}
}
#mapwrap{background:var(--paper)}
svg#map{width:100%;height:auto;display:block;max-height:calc(100vh - 58px);touch-action:manipulation}
#panel{padding:14px 18px 28px;background:var(--panel)}
#panel h2{font-size:22px;margin:4px 0 2px}
#panel h3{font-size:15px;margin:18px 0 6px;color:var(--muted);font-weight:600}
.sub{margin:0 0 10px;color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0;font-size:15px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px;min-height:44px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
button.ghost{border-color:transparent;color:var(--muted);padding-left:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:14px;margin:10px 0}
.warn{color:var(--warn)} .ok{color:var(--ok)}
.stepper{display:flex;align-items:center;gap:12px;margin:12px 0}
.stepper output{font-size:30px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center;font-weight:600}
.stepper button{width:52px;font-size:22px;padding:0}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:15px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:1px}
.d0{background:var(--p0)}.d1{background:var(--p1)}.d2{background:var(--p2)}.d3{background:var(--p3)}.d4{background:var(--p4)}
.standing{font-size:14px;padding:6px 0;border-bottom:1px solid var(--grid)}
.standing small{color:var(--muted);display:block;margin-left:18px}
/* map */
.f0{fill:var(--p0)}.f1{fill:var(--p1)}.f2{fill:var(--p2)}.f3{fill:var(--p3)}.f4{fill:var(--p4)}
.fn{fill:var(--paper);stroke:var(--neutral);stroke-width:2}
.s0{stroke:var(--p0)}.s1{stroke:var(--p1)}.s2{stroke:var(--p2)}.s3{stroke:var(--p3)}.s4{stroke:var(--p4)}
.chartline{fill:none;stroke-width:2.5;stroke-linejoin:round}
.chartline.para{stroke:var(--p0);stroke-width:2.5;stroke-dasharray:6 5;opacity:.75}
.dash{display:inline-block;width:22px;border-top:2.5px dashed var(--p0);margin:0 7px 0 2px;vertical-align:3px;opacity:.75}
.astro{fill:none;stroke:var(--grid);stroke-width:1}
.lane{stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 6;stroke-linecap:round}
.pname{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:17px;fill:var(--ink);text-anchor:middle}
.pships{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.pyield{font-size:13px;fill:var(--muted);text-anchor:middle}
.selring{fill:none;stroke:var(--ink);stroke-width:2.5}
.adjring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5}
.fortring{fill:none;stroke:var(--neutral);stroke-width:1.5}
.order{stroke:var(--p0);stroke-width:3}
.orderlbl{fill:var(--p0);font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central}
.lane.closed{stroke:var(--warn);stroke-dasharray:6 5;stroke-width:2.5}
.worm{fill:none;stroke:var(--p3);stroke-width:2.5;stroke-dasharray:10 6}
.flag{fill:var(--warn);font-size:24px;font-weight:800}
ul.events li{border-left:3px solid var(--line);padding-left:10px}
ul.events li.you{border-left-color:var(--warn);font-weight:600}
button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stat.warn{color:var(--warn)}
.maptip{font-size:20px;fill:var(--accent);font-weight:600}
.orderbg{fill:var(--paper);stroke:var(--p0);stroke-width:1.5}
/* overlay */
#overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(14,23,41,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px;z-index:5}
#overlay.show{display:flex}
.card{background:var(--panel);max-width:640px;width:100%;border-radius:16px;padding:22px 24px 26px}
.card h2{font-size:30px;margin:0 0 6px;letter-spacing:.06em}
.card h3{font-size:18px;margin:22px 0 6px}
.card p{margin:6px 0}
.card ol{padding-left:22px;margin:8px 0}
.card ol li{margin:4px 0}
.core{border-left:4px solid var(--accent);padding:8px 14px;margin:16px 0;font-size:17px;background:var(--paper)}
article{border-top:1px solid var(--grid);padding-top:4px;margin-top:14px}
.k{display:inline-block;min-width:5.5em;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: no-preference){ .card{animation:rise .25s ease-out} @keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}} }

header .fsbtn{margin-left:auto;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:17px;padding:8px 18px}
header .fsbtn+.end{margin-left:0}
body.big .layout{grid-template-columns:1fr!important;height:auto!important}
body.big svg#map{max-height:none}
body.big #panel{border-left:none;border-top:1px solid var(--grid);font-size:18px}
body.big #panel h2{font-size:26px}
body.big header{position:sticky;top:0;z-index:4;background:var(--bg)}
body.big .pname{font-size:26px}body.big .pships{font-size:24px}body.big .pyield{font-size:19px}
body.big .cname{font-size:30px}body.big .ctag{font-size:21px}body.big .maptip{font-size:28px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;max-width:min(92vw,560px);background:var(--ink);color:var(--panel);padding:12px 16px;border-radius:12px;font-size:15px;z-index:9;display:none}
#toast.show{display:block}
.chip{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px;vertical-align:1px}
.chip.war{border-color:var(--p1);color:var(--p1);font-weight:700}.chip.ally{border-color:var(--p4);color:var(--p4);font-weight:700}
.dip{padding:10px 0;border-bottom:1px solid var(--grid)}.dip .row{margin-top:6px}.dip .row button{padding:6px 12px;font-size:15px}
.req{border:2px solid var(--accent);border-radius:12px;padding:10px 12px;margin:8px 0}
.pledge{font-size:15px;fill:var(--p1);font-weight:700;text-anchor:middle}
#mapwrap{position:relative}
.tabs{display:flex;gap:6px;position:sticky;top:-14px;background:var(--panel);padding:8px 0 10px;margin:-6px 0 4px;z-index:2;border-bottom:1px solid var(--grid)}
.tabs button{flex:1;position:relative;font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--p1);color:#fff;font-size:13px;line-height:20px}
.newdot{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--p1)}
#brief{position:absolute;left:12px;right:12px;top:12px;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px 10px;z-index:3;font-size:15px;display:none}
#brief.show{display:block;animation:rise .25s ease-out}
#brief h4{margin:0 0 6px;font-size:16px}
#brief ul{margin:0;padding-left:18px}#brief li{margin:4px 0}
#brief small{display:block;color:var(--muted);margin-top:6px}
#zoombar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:2}
#zoombar button{background:var(--panel);min-width:44px;font-size:20px;padding:4px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#zoombar button.txt{font-size:15px}
#maptipH{position:absolute;left:12px;bottom:14px;font-size:15px;font-weight:600;color:var(--accent);z-index:2;pointer-events:none;max-width:60%}
#panel>.pane{animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){#panel>.pane,#brief.show{animation:none}}
button:active:not(:disabled){transform:scale(.97)}
button{transition:background .15s,transform .08s}
.flashring{fill:none;stroke:var(--ink);stroke-width:4;animation:flash .9s ease-out forwards}
.fx .flashring.lost{stroke:#E8505B}
.fx .pop{transform-box:fill-box;transform-origin:center;animation:pop2 .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;box-shadow:inset 0 0 90px 10px rgba(232,80,91,.45)}
#vig.on{animation:vig .9s ease-out}
@keyframes vig{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.fx .hdrnum.bump{animation:pop2 .3s ease-out;display:inline-block}
@media (prefers-reduced-motion: reduce){.fx .pop,#vig.on{animation:none}}
@keyframes flash{from{opacity:1;stroke-width:8}to{opacity:0;stroke-width:1}}
.mover{stroke:var(--panel);stroke-width:2}
.credit{font-size:13px;color:var(--muted);display:block}
.bub{max-width:88%;padding:8px 12px;border-radius:14px;margin:8px 0;font-size:15px;background:var(--paper);border-left:4px solid var(--line)}
.bub small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.bub.you{margin-left:auto;background:var(--accent);color:var(--on-accent);border-left:none;border-right:4px solid var(--ink)}
.bub.you small{color:var(--on-accent);opacity:.8}
.bub.b1{border-left-color:var(--p1)}.bub.b2{border-left-color:var(--p2)}.bub.b3{border-left-color:var(--p3)}.bub.b4{border-left-color:var(--p4)}
.ooc{margin-left:6px;font-size:11px;padding:0 6px;border-radius:99px;background:var(--p1);color:#fff}
.bar{height:10px;border-radius:99px;background:var(--grid);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--accent)}

html.nogap .row>*,html.nogap .tabs>*,html.nogap #zoombar>*,html.nogap header>*{margin:0 8px 8px 0}
.tabs{position:-webkit-sticky;position:sticky}
/* ===== 极简平面主题（参考 Mini Motorways 的质感） ===== */
html:root{
  --bg:#D7E6EC; --paper:#FFFFFF; --ink:#26323F; --muted:#6E7D8C; --line:#C3D2DA; --grid:#E3ECF0;
  --p0:#3F7FD9; --p1:#E8505B; --p2:#F0AE3C; --p3:#8C6AD3; --p4:#29B394; --neutral:#FFFFFF;
  --panel:#FFFFFF; --accent:#26323F; --on-accent:#FFFFFF; --on-faction:#FFFFFF; --warn:#E8505B; --ok:#1E9E80;
  --soft:#EEF3F6; --shadow:0 8px 24px rgba(38,60,80,.12),0 1px 2px rgba(38,60,80,.08);
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:0}
h1,h2,.card h2,#panel h2,.pname,.cname{font-family:inherit!important;font-weight:700;letter-spacing:-.01em}
/* 顶栏：悬浮白色胶囊 */
header{position:-webkit-sticky;position:sticky;top:0;z-index:4;background:rgba(215,230,236,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:0;padding:10px 14px;gap:8px}
header h1{font-size:22px;letter-spacing:.08em;margin-right:4px}
.stat{display:inline-flex;align-items:baseline;background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted);box-shadow:0 1px 2px rgba(38,60,80,.08)}
.stat b{font-size:16px;margin:0 3px;color:var(--ink);font-weight:700}
.stat.warn{color:var(--p1)}
#goalbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 14px 6px;padding:8px 8px 8px 16px;background:#fff;border-radius:999px;box-shadow:var(--shadow);font-size:14px}
#goalbar[hidden]{display:none}
#goalbar .gl{color:var(--muted)}
#goalbar .gg{font-weight:700}
#goalbar .gp{font-variant-numeric:tabular-nums;font-weight:700;color:#fff;background:var(--p0);padding:2px 12px;border-radius:999px}
#goalbar .gt{color:var(--muted)}
#goalbar button{margin-left:auto}
/* 布局 */
#mapwrap{background:var(--bg)}
@media (min-width:860px){
  .layout{grid-template-columns:1fr 360px;gap:0}
  #panel{margin:0 14px 14px 0;border-radius:22px;box-shadow:var(--shadow);border:0!important;max-height:calc(100vh - 80px)}
}
#panel{background:#fff;border:0!important}
#panel h2{font-size:24px}
#panel h3{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:20px 0 8px}
.sub{color:var(--muted)}
.facts dt{color:var(--muted)}
/* 按钮 */
button{border-radius:14px;border:0;background:var(--soft);color:var(--ink);font-weight:600;transition:background .15s,transform .1s cubic-bezier(.2,.8,.2,1),box-shadow .15s}
button:hover:not(:disabled){background:#E4ECF0}
button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.38}
button.primary{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(38,50,63,.25)}
button.primary:hover:not(:disabled){background:#33414F}
button.on{background:var(--p0);color:#fff}
button.ghost{background:transparent;color:var(--muted)}
button.sm{min-height:34px;padding:4px 14px;font-size:13px}
button.big{min-height:54px;padding:12px 28px;font-size:17px;border-radius:18px}
.fsbtn{background:#fff!important;color:var(--ink)!important;border:0!important;box-shadow:0 1px 2px rgba(38,60,80,.1)}
header .end{box-shadow:0 6px 16px rgba(38,50,63,.25)}
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,80,91,.55)}50%{box-shadow:0 0 0 10px rgba(232,80,91,0)}}
/* iOS 风格分段控件 */
.tabs{background:var(--soft);border-radius:14px;padding:4px;gap:4px;border:0;margin:0 0 8px}
.tabs button{background:transparent;min-height:38px;border-radius:11px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(38,60,80,.14)}
.badge{background:var(--p1)}
/* 卡片 */
.core{border:0;border-radius:16px;background:var(--soft);padding:12px 16px}
.core.ok{background:#E3F5EF}.core.warn{background:#FDE8EA}
.dip,.standing{border-bottom:1px solid var(--grid)}
.req{border:0;background:#FFF6E3;border-radius:16px;padding:12px 14px}
.bub{background:var(--soft);border:0;border-radius:18px}
.bub.b1{background:#FDE8EA}.bub.b2{background:#FFF3DC}.bub.b3{background:#EFEAFB}.bub.b4{background:#E1F6EF}
.bub.you{background:var(--p0);color:#fff;border:0}
.bub.you small{color:rgba(255,255,255,.8)}
.chip{border:0;background:var(--soft);font-weight:600}
.chip.war{background:#FDE8EA;color:var(--p1)}.chip.ally{background:#E1F6EF;color:var(--ok)}
ul.events li{border-left:3px solid var(--line)}
ul.events li.you{border-left-color:var(--p1)}
.dot{box-shadow:0 1px 2px rgba(0,0,0,.15)}
/* 地图：平面色块 + 投影 + 奶白道路 */
.astro{display:none}
.laneb{stroke:#C4D6DD;stroke-width:16;stroke-linecap:round}
.lane{stroke:#FBF8F1;stroke-width:11;stroke-linecap:round;stroke-dasharray:none}
.lane.closed{stroke:#F6C9CD;stroke-dasharray:none}
.worm{stroke:var(--p3);stroke-width:5;stroke-dasharray:2 10;stroke-linecap:round;fill:none;opacity:.7}
.pshadow{fill:rgba(38,64,84,.18)}
.fn{fill:#FFFFFF;stroke:none}
.f0,.f1,.f2,.f3,.f4{filter:none;stroke:none}
.pships{font-family:-apple-system,"SF Pro Rounded","PingFang SC",sans-serif;font-size:17px;font-weight:800}
.pname{font-size:17px;fill:#3D4D5C;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.pyield{font-size:14px;fill:#7A8A99;font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.selring{fill:none;stroke:var(--ink);stroke-width:3}
.adjring{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:2.5;stroke-dasharray:3 6;animation:march 1.4s linear infinite}
.coachring{fill:none;stroke:var(--p1);stroke-width:4;animation:breathe 1s ease-in-out infinite}
@keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
@keyframes march{to{stroke-dashoffset:-18}}
.fortring{stroke:#9FB2BE;stroke-width:2.5;fill:none}
.order{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.orderbg{fill:#fff;stroke:none;filter:drop-shadow(0 2px 3px rgba(38,60,80,.2))}
.orderlbl{fill:var(--ink);font-weight:800}
.flag{fill:var(--p1);font-weight:800}
.mover{stroke:#fff;stroke-width:2}
.flashring{stroke:var(--ink)}
#zoombar button{background:#fff;box-shadow:var(--shadow);min-width:46px}
#maptipH{color:var(--ink);font-weight:700;text-shadow:0 0 6px var(--bg),0 0 3px var(--bg)}
/* 简报、引导卡 */
#brief,#coach{background:#fff;border:0;border-radius:20px;box-shadow:0 12px 32px rgba(38,60,80,.18)}
#brief{border-left:0}
#coach{position:absolute;left:12px;right:12px;bottom:72px;max-width:440px;margin:0 auto;padding:13px 16px;z-index:3;font-size:15.5px;line-height:1.6;display:none;cursor:pointer}
#coach.top{top:12px;bottom:auto}
#coach.show{display:block;animation:pop .32s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}

        G.loanUI.term = +b.dataset.a;
        render();
        break;
      case "loanback":
        G.loanUI = null;
        render();
        break;
      case "loango": {
        const u = G.loanUI, t = terms(u.f, 0, u.amount, u.term);
        if (t.ok) {
          say(u.f, "you", "borrow", { amt: u.amount, term: u.term, owed: t.owed });
          say(u.f, "them", "yes");
          makeLoan(u.f, 0, u.amount, u.term, t.rate, t.owed, t.coll);
          G.dipUsed[u.f] = true;
          dnote("你向".concat(FACTIONS[u.f].name, "借了 ").concat(u.amount, " 能源，第 ").concat(G.turn + u.term, " 回合结束时还 ").concat(t.owed, "。"));
        }
        G.loanUI = null;
        render();
        break;
      }
      case "repay": {
        const l = G.loans.find((x) => x.id === +b.dataset.id);
        if (l && l.active) {
          const c = earlyCost(l);
          if (G.energy[0] >= c) {
            G.energy[0] -= c;
            G.energy[l.L] += c;
            l.active = false;
            l.outcome = "early";
            l.paid = c;
            say(l.L, "you", "repay");
            say(l.L, "them", "yes");
            relAdd(l.L, 10);
            dnote("提前还清了欠".concat(fname(l.L), "的钱，付了 ").concat(c, "，比到期少付 ").concat(l.owed - c, "。"));
          }
        }
        render();
        break;
      }
    }
  });
  const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const fsLabel = () => fsOn() ? "退出全屏" : document.body.classList.contains("big") ? "恢复原样" : "全屏";
  function toast(t) {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.setAttribute("role", "status");
      document.body.appendChild(el);
    }
    el.textContent = t;
    el.classList.add("show");
    clearTimeout(toast.h);
    toast.h = setTimeout(() => el.classList.remove("show"), 5e3);
  }
  function toggleFS() {
    const d = document, el = d.documentElement;
    if (fsOn()) {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      return;
    }
    if (d.body.classList.contains("big")) {
      d.body.classList.remove("big");
      render();
      return;
    }
    const fallback = () => {
      d.body.classList.add("big");
      render();
      window.scrollTo(0, 0);
      toast("这个窗口不允许真正全屏，已改成放大模式：地图铺满宽度，操作面板挪到地图下面。再点一次「恢复原样」就回去。");
    };
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || !(d.fullscreenEnabled || d.webkitFullscreenEnabled)) {
      fallback();
      return;
    }
    try {
      const p = req.call(el);
      if (p && p.catch) p.catch(fallback);
    } catch (e) {
      fallback();
    }
  }
  document.addEventListener("fullscreenchange", () => render());
  document.addEventListener("webkitfullscreenchange", () => render());

  render();

  }, mediate, utopiaCheck, hire, buyPlanet, buyable, startExile, RACE, shipCost, dipAct, spy, expose, gift, claim, answer, terms, makeLoan, atWar, allied, alive, count, AI, botTurn, parallel, strategy, CFG, newGame, endTurn, addOrder, analyze, onPlanet, avail, need, nbrs };
})();
